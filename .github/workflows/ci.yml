name: Reproducibility checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run environment tests
        run: python3 -m unittest discover -s tests
      - name: Rebuild run summary
        run: python3 scripts/summarize_runs.py
      - name: Check committed summaries
        run: git diff --exit-code -- results/

